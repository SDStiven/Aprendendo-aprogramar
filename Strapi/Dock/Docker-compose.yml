services:
  pgadmin4:
    image: dpage/pgadmin4:9.2
    container_name: pgadmin4

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - 5050:80
    #restart: unless-stopped
    volumes:
      - pgadmin-2025:/var/lib/pgadmin
    networks:
      - strapi-network

# Volume Persistente
volumes:
  pg15_data:
    name: pg15_data
  pgadmin-2025:
    name: pgadmin-2025

networks:
  strapi-network:
    name: strapi-network
    external: true
