<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura</title>
</head>

<body>

    <div>
        <h1>Conversor de Temperatura</h1>
        <p>Digite a temperatura em Celsius:</p>
        <input type="number" id="celsius">
        <button onclick="converterTemperatura()">Converter</button>
        <p>Temperatura em Fahrenheit: <span id="fahrenheit"></span></p>
        <p>Temperatura em Kelvin: <span id="kelvin"></span></p>

    </div>
    <script src="temperatura.js"></script>
</body>

</html>
